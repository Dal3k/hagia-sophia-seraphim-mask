<!DOCTYPE html><html><head><meta charset="utf-8"><title>Masque séraphin — 3D</title>
<style>body{margin:0;background:#2a2530;overflow:hidden;font:13px sans-serif;color:#ddd}
#ui{position:fixed;left:10px;top:8px;display:flex;gap:6px;align-items:center}
button{background:#443c4c;color:#eee;border:1px solid #6a5f74;border-radius:4px;padding:4px 8px;cursor:pointer}
button.on{background:#a8873a;color:#111}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div id="ui"><span>Glisser = tourner · molette = zoom</span>
<button id="b1" class="on">Lumière vitrine (rasante, haut)</button><button id="b2">Lumière douce</button>
<button id="v1">Face</button><button id="v2">Profil</button><button id="v3">3/4</button></div>
<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight); r.setPixelRatio(devicePixelRatio); document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color(0x2a2530);
const env=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture;
const c=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,1,5000); c.position.set(0,0,520);
const o=new OrbitControls(c,r.domElement);
const hemi=new THREE.HemisphereLight(0xfff4e0,0x201810,0.25); s.add(hemi);
const d=new THREE.DirectionalLight(0xfff2dc,3.0); s.add(d);
const mat=new THREE.MeshStandardMaterial({color:0xcaa860,metalness:0.55,roughness:0.45,flatShading:true});
function vitrine(){d.position.set(15,400,150); s.environment=null; hemi.intensity=0.25; mat.metalness=0.3; mat.roughness=0.6;}
function douce(){d.position.set(-120,180,300); s.environment=env; hemi.intensity=0.5; mat.metalness=0.85; mat.roughness=0.3;}
vitrine();
const sel=(id,f)=>document.getElementById(id).onclick=()=>{f(); if(id[0]==='b'){b1.classList.toggle('on',id==='b1'); b2.classList.toggle('on',id==='b2');}};
sel('b1',vitrine); sel('b2',douce);
sel('v1',()=>c.position.set(0,0,520)); sel('v2',()=>c.position.set(520,0,30)); sel('v3',()=>c.position.set(-300,-180,380));
new STLLoader().load('sortie/masque.stl?'+Date.now(),g=>{s.add(new THREE.Mesh(g,mat));});
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
(function a(){requestAnimationFrame(a);o.update();r.render(s,c)})();
</script></body></html>
